<style>
:root{
  --marun:#7E1735; --marun-tua:#5C0F26; --marun-gelap:#3A0818; --marun-muda:#FBF2F4;
  --kuning:#FDD100; --garis:#EBD5DB; --teks:#2D2D2D; --lembut:#6b5f64;
  --hijau:#2d7a00; --merah:#b3261e; --bg:#F6F1F3; --radius:14px;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:130px}
body{margin:0;font:400 16px/1.6 var(--font);color:var(--teks);background:var(--bg);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;color:var(--marun-tua);margin:0 0 .4em;line-height:1.25}
p{margin:0 0 .8em}
:focus-visible{outline:3px solid var(--marun);outline-offset:2px;border-radius:6px}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:46px;padding:.6rem 1.2rem;border-radius:999px;border:2px solid transparent;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;transition:.2s;background:var(--marun);color:#fff}
.btn:hover:not(:disabled){background:var(--marun-tua)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sek{background:#fff;color:var(--marun);border-color:var(--marun)}
.btn.sek:hover:not(:disabled){background:var(--marun-muda)}
.btn.kuning{background:var(--kuning);color:var(--marun-gelap)}
.btn.kuning:hover:not(:disabled){background:#ffe14d}
.btn.kecil{min-height:40px;padding:.35rem .9rem;font-size:.88rem}
.btn.bahaya{background:#fff;color:var(--merah);border-color:#e3b7b3}
.btn.bahaya:hover:not(:disabled){background:#fdeceb}
.btn.ikon{min-height:40px;min-width:40px;padding:0;font-size:1rem}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:1.2rem;background:linear-gradient(160deg,var(--marun-gelap),var(--marun-tua) 60%,var(--marun))}
.login-kartu{width:min(440px,100%);background:#fff;border-radius:22px;padding:2rem 1.6rem 1.6rem;box-shadow:0 24px 60px rgba(0,0,0,.35);border-top:6px solid var(--kuning)}
.login-kartu .logo{display:block;width:84px;height:84px;margin:-3.6rem auto .8rem;border-radius:50%;background:#fff;padding:5px;box-shadow:0 0 0 4px var(--kuning),0 8px 20px rgba(0,0,0,.25)}
.login-kartu h1{text-align:center;font-size:1.5rem}
.login-kartu .sub{text-align:center;color:var(--lembut);font-size:.92rem;margin-bottom:1.2rem}
.galat{color:var(--merah);font-size:.92rem;min-height:1.4em;margin:.4rem 0 .6rem}
.sandi-baris{position:relative}
.sandi-baris input{padding-right:3.2rem}
.sandi-baris button{position:absolute;right:4px;top:4px;min-width:44px;height:44px;border:0;background:none;cursor:pointer;font-size:1.1rem;border-radius:10px}
.ingat{display:flex;align-items:center;gap:.6rem;font-size:.92rem;margin:.2rem 0 1rem;cursor:pointer;min-height:44px}
.ingat input{width:20px;height:20px;accent-color:var(--marun)}

/* ---------- bentuk isian ---------- */
.fld{margin-bottom:1.1rem}
.fld>label,.fld>.lab{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;font-weight:600;font-size:.92rem;color:var(--marun-tua);margin-bottom:.3rem}
.bantuan{font-size:.84rem;color:var(--lembut);margin:.3rem 0 0}
input[type=text],input[type=url],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:46px;padding:.65rem .9rem;border:1.5px solid #d9b8c2;border-radius:12px;background:#fff}
textarea{resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(126,23,53,.25);border-color:var(--marun)}
.perlu-tag{display:none;background:#FFF3B0;color:#5c4a00;border:1px solid #ecd45a;border-radius:999px;font-size:.72rem;font-weight:600;padding:.05rem .6rem}
.fld.perlu .perlu-tag{display:inline-block}
.fld.perlu input[type=text],.fld.perlu input[type=url],.fld.perlu input[type=tel],.fld.perlu textarea,.row-teks.perlu input{border-color:#e2bf2a;background:#FFFCE6}
.kilat{animation:kilat 1.6s ease}
@keyframes kilat{0%,60%{box-shadow:0 0 0 6px rgba(253,209,0,.7);border-radius:12px}100%{box-shadow:0 0 0 0 rgba(253,209,0,0)}}

/* saklar */
.saklar{display:flex;align-items:center;gap:.75rem;cursor:pointer;min-height:46px}
.saklar input{position:absolute;opacity:0;width:1px;height:1px}
.saklar .sl{flex:none;width:50px;height:28px;border-radius:999px;background:#cdbfc4;position:relative;transition:.2s}
.saklar .sl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.saklar input:checked+.sl{background:var(--marun)}
.saklar input:checked+.sl::after{left:25px}
.saklar input:focus-visible+.sl{outline:3px solid var(--marun);outline-offset:2px}
.saklar .tx{font-size:.95rem}

/* ikon */
.ikon-baris{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.ikon-baris button{width:42px;height:42px;border:1.5px solid var(--garis);border-radius:10px;background:#fff;font-size:1.25rem;cursor:pointer}
.ikon-baris button:hover{background:var(--marun-muda);border-color:var(--marun)}
.ikon-input{max-width:120px;text-align:center;font-size:1.4rem}

/* gambar */
.img-fld{display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap}
.thumb{width:160px;height:120px;flex:none;border:1.5px solid var(--garis);border-radius:12px;overflow:hidden;display:grid;place-items:center;
  background-color:#fff;background-image:linear-gradient(45deg,#f1e6ea 25%,transparent 25%),linear-gradient(-45deg,#f1e6ea 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f1e6ea 75%),linear-gradient(-45deg,transparent 75%,#f1e6ea 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb .kosong{font-size:.78rem;color:var(--lembut);text-align:center;padding:.5rem;background:rgba(255,255,255,.85);border-radius:8px}
.img-info{flex:1;min-width:200px;display:grid;gap:.5rem}
.img-aksi{display:flex;flex-wrap:wrap;gap:.5rem}
.img-info details summary{cursor:pointer;font-size:.86rem;color:var(--marun);min-height:36px;display:flex;align-items:center}
.status{font-size:.85rem;color:var(--hijau);min-height:1.2em}
.status.proses{color:var(--lembut)}

/* kartu & daftar */
.kartu{min-width:0;background:#fff;border:1px solid var(--garis);border-radius:var(--radius);padding:1.3rem 1.3rem .5rem;margin-bottom:1.1rem;box-shadow:0 2px 10px rgba(92,15,38,.05)}
.kartu>h2{font-size:1.15rem;display:flex;align-items:center;gap:.5rem;padding-bottom:.6rem;margin-bottom:1rem;border-bottom:2px solid var(--kuning)}
.kartu.daftar-kartu{padding-bottom:1.2rem}
.item{border:1px solid var(--garis);border-radius:12px;background:#fff;margin-bottom:.6rem;overflow:hidden}
.item[open]{border-color:var(--marun);box-shadow:0 4px 14px rgba(126,23,53,.1)}
.item>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.75rem;padding:.55rem 1rem;min-height:52px}
.item>summary::-webkit-details-marker{display:none}
.item>summary::after{content:"▾";margin-left:auto;color:var(--lembut);transition:.2s}
.item[open]>summary::after{transform:rotate(180deg)}
.item>summary .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--marun);color:var(--kuning);display:grid;place-items:center;font-size:.82rem;font-weight:600}
.item>summary .jdl{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.item-isi{padding:1rem 1rem .3rem;border-top:1px dashed var(--garis)}
.item-aksi{display:flex;flex-wrap:wrap;gap:.5rem;padding:.2rem 1rem 1rem;justify-content:flex-end}
.kosong-daftar{color:var(--lembut);background:var(--marun-muda);border-radius:12px;padding:1rem;text-align:center}
.row-teks{display:flex;gap:.4rem;margin-bottom:.5rem;align-items:flex-start}
.row-teks input{flex:1;min-width:0}
.row-teks .btn{flex:none}
.tambah{margin-top:.6rem}

/* galeri */
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.8rem}
.g-kartu{border:1px solid var(--garis);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.g-kartu .thumb{width:100%;height:130px;border:0;border-radius:0}
.g-kartu .g-isi{padding:.6rem;display:grid;gap:.5rem}
.g-kartu input[type=text]{min-height:40px;font-size:.9rem;padding:.4rem .6rem}
.g-aksi{display:flex;gap:.3rem;justify-content:space-between}
.g-aksi .btn{flex:1;min-width:0}

/* ---------- aplikasi ---------- */
.atas{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,var(--marun-gelap),var(--marun-tua));color:#fff;border-bottom:3px solid var(--kuning);display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.55rem 1rem}
.atas .merek{display:flex;align-items:center;gap:.7rem;min-width:0}
.atas .merek img{width:42px;height:42px;border-radius:50%;background:#fff;padding:2px;flex:none}
.atas strong{display:block;font:600 1rem/1.2 var(--font)}
.atas small{display:block;font-size:.74rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atas .aksi-atas{display:flex;gap:.5rem;flex:none}
.atas .btn.sek{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.atas .btn.sek:hover:not(:disabled){background:#fff;color:var(--marun-tua)}
.tata{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px;margin:0 auto;gap:1.5rem;padding:1.4rem 1rem 130px}
.nav{position:sticky;top:78px;align-self:start;display:grid;gap:.2rem;max-height:calc(100vh - 100px);overflow:auto}
.nav a{display:flex;align-items:center;gap:.65rem;padding:.6rem .8rem;border-radius:12px;color:var(--marun-tua);text-decoration:none;font-weight:500;font-size:.95rem;border-left:4px solid transparent;min-height:46px}
.nav a:hover{background:#fff}
.nav a.aktif{background:#fff;border-left-color:var(--kuning);font-weight:600;box-shadow:0 2px 8px rgba(92,15,38,.08)}
.nav .cnt{margin-left:auto;min-width:22px;height:22px;border-radius:999px;background:var(--kuning);color:var(--marun-gelap);font-size:.74rem;font-weight:600;display:none;place-items:center;padding:0 .4rem}
.nav .cnt.ada{display:grid}
.utama{min-width:0;max-width:860px;outline:none}
.judul-bagian{margin-bottom:1.1rem}
.judul-bagian h1{font-size:1.7rem;margin-bottom:.15em}
.judul-bagian p{color:var(--lembut);margin:0}

.banner{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;background:#FFF9D6;border:1px solid #ecd45a;border-radius:var(--radius);padding:.9rem 1.1rem;margin-bottom:1.1rem;font-size:.93rem}
.banner.info{background:#EEF4FF;border-color:#bcd0f5}
.banner .teks{flex:1 1 240px}
.banner .btn{flex:none}

.tegel{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin-bottom:1.1rem}
.tegel button{background:#fff;border:1px solid var(--garis);border-radius:var(--radius);padding:1rem;text-align:left;cursor:pointer;min-height:84px;transition:.2s}
.tegel button:hover{border-color:var(--marun);transform:translateY(-2px)}
.tegel b{display:block;font:700 1.9rem/1.1 'Playfair Display',serif;color:var(--marun)}
.tegel span{font-size:.86rem;color:var(--lembut)}
.perlu-daftar{display:grid;grid-template-columns:minmax(0,1fr);gap:.4rem;margin-bottom:.8rem}
.perlu-baris{display:flex;align-items:center;gap:.7rem;border:1px solid var(--garis);border-radius:12px;padding:.5rem .5rem .5rem .9rem;background:#fff;min-height:54px}
.perlu-baris .info{flex:1;min-width:0}
.perlu-baris .info b{display:block;font-size:.9rem;color:var(--marun-tua)}
.perlu-baris .info span{display:block;font-size:.8rem;color:var(--lembut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langkah-awal{margin:0 0 1rem;padding-left:1.2rem}
.langkah-awal li{margin-bottom:.3rem}
.riwayat-baris{display:flex;align-items:center;gap:.7rem;border:1px solid var(--garis);border-radius:12px;padding:.5rem .6rem .5rem .9rem;margin-bottom:.4rem;flex-wrap:wrap}
.riwayat-baris span{flex:1 1 200px;font-size:.9rem}

/* bilah simpan */
.bilah{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:3px solid var(--garis);box-shadow:0 -6px 20px rgba(58,8,24,.12);padding:.6rem 1rem}
.bilah.kotor{border-top-color:var(--kuning)}
.bilah-dalam{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
#bilahStatus{flex:1 1 220px;font-size:.9rem;min-width:0}
#bilahStatus strong{display:block;color:var(--marun-tua)}
.peringatan{color:#7a5d00}
.bilah .btn{flex:none}

.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--marun-gelap);color:#fff;padding:.8rem 1.2rem;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:80;opacity:0;pointer-events:none;transition:.3s;max-width:min(560px,92vw);font-size:.93rem;border-left:5px solid var(--kuning)}
.toast.tampil{opacity:1;transform:translate(-50%,0)}
.toast.galat{border-left-color:#ff6b61}

/* ---------- ponsel & tablet ---------- */
@media (max-width:900px){
  .tata{grid-template-columns:1fr;gap:.9rem;padding-top:0}
  .nav{position:sticky;top:62px;z-index:30;display:flex;overflow-x:auto;gap:.4rem;margin:0 -1rem;padding:.6rem 1rem;background:var(--bg);border-bottom:1px solid var(--garis);max-height:none;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:none;border-left:0;border:1.5px solid var(--garis);background:#fff;border-radius:999px;padding:.4rem .95rem;min-height:44px;white-space:nowrap}
  .nav a.aktif{background:var(--marun);color:#fff;border-color:var(--marun);box-shadow:none}
  .nav .cnt{background:var(--kuning)}
  .judul-bagian{margin-top:.9rem}
  html{scroll-padding-top:140px}
}
@media (max-width:560px){
  .atas small{display:none}
  .atas .btn.kecil .tx-panjang{display:none}
  .judul-bagian h1{font-size:1.4rem}
  .kartu{padding:1.1rem 1rem .4rem}
  .thumb{width:100%;height:150px}
  .img-info{min-width:0;width:100%}
  .bilah-dalam .btn{flex:1}
  #bilahStatus{flex-basis:100%}
  .toast{bottom:130px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const klon = o=>JSON.parse(JSON.stringify(o));
const getP = (o,p)=>String(p).split('.').reduce((x,k)=>x==null?undefined:x[k],o);
function setP(o,p,v){
  const k=String(p).split('.'); let x=o;
  for(let i=0;i<k.length-1;i++){ if(x[k[i]]==null||typeof x[k[i]]!=='object') x[k[i]]={}; x=x[k[i]]; }
  x[k[k.length-1]]=v;
}
let _uid=0; const uid=()=>'f'+(++_uid);
function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const k in (props||{})){
    const v=props[k]; if(v==null||v===false) continue;
    if(k==='text') e.textContent=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else if(['value','checked','hidden','disabled','open','multiple'].includes(k)) e[k]=v;
    else e.setAttribute(k,v===true?'':v);
  }
  kids.flat(Infinity).forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType?c:document.createTextNode(String(c))); });
  return e;
}
const lengkapi=(t,d)=>{
  for(const k in d){
    if(t[k]===undefined) t[k]=klon(d[k]);
    else if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k])&&t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k])) lengkapi(t[k],d[k]);
  }
  return t;
};

const S={ token:null, konten:null, server:'', diperbarui:null, bagian:'ringkasan', sandiAwal:false, pertama:false, sibuk:false };
const kotor=()=>JSON.stringify(S.konten)!==S.server;

/* sesi */
const KS='mwa_sesi', KD='mwa_draf_v1', KA='mwa_api';
function simpanSesi(ingat,j){
  const o=JSON.stringify({token:j.token,exp:Date.now()+(j.berlaku||21600)*1000-120000,sandiAwal:!!j.sandiAwal});
  try{ (ingat?localStorage:sessionStorage).setItem(KS,o); (ingat?sessionStorage:localStorage).removeItem(KS); }catch(e){}
}
function bacaSesi(){
  for(const st of [sessionStorage,localStorage]){
    try{ const o=JSON.parse(st.getItem(KS)||'null'); if(o&&o.token&&o.exp>Date.now()) return o; }catch(e){}
  }
  return null;
}
function hapusSesi(){ try{ sessionStorage.removeItem(KS); localStorage.removeItem(KS); }catch(e){} }
function simpanDraf(){
  try{ if(kotor()&&S.konten) localStorage.setItem(KD,JSON.stringify({waktu:Date.now(),konten:S.konten})); else localStorage.removeItem(KD); }catch(e){}
}

   API
   ========================================================= */
const apiUrl=()=>(KONFIG.apiUrl||localStorage.getItem(KA)||'').trim();
async function api(aksi,data){
  const url=apiUrl(); if(!url) throw new Error('Alamat API belum diisi.');
  let r;
  try{
    r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({aksi,token:S.token},data||{}))});
  }catch(e){ throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet dan alamat API.'); }
  let j; try{ j=await r.json(); }
  catch(e){ throw new Error('Balasan server tidak dikenali. Pastikan alamat API benar dan akses aplikasi web diatur ke “Siapa saja”.'); }
  if(j&&j.kode==='sesi'){ keluarPaksa(j.pesan); throw new Error(j.pesan); }
  if(!j||!j.ok) throw new Error((j&&j.pesan)||'Permintaan gagal.');
  return j;
}
async function bacaPublik(){
  const u=apiUrl(); let r;
  try{ r=await fetch(u+(u.includes('?')?'&':'?')+'aksi=konten'); }catch(e){ throw new Error('Tidak dapat terhubung ke server.'); }
  const j=await r.json().catch(()=>null);
  if(!j||!j.ok) throw new Error('Gagal membaca konten dari server.');
  return j;
}

const perlu=(f,v)=>(typeof v==='string'&&/\[GANTI/i.test(v))||(!!f.wajib&&(v==null||String(v).trim()===''));
function telusuri(bag,cb){
  const walk=(blok,root,prefix,ctx)=>{
    blok.forEach(b=>{
      if(b.t==='grup') walk(b.fields,root,prefix,ctx);
      else if(b.t==='daftarTeks'){ (getP(root,b.p)||[]).forEach((v,i)=>cb(bag,{label:b.label+' '+(i+1),tipe:'teks'},v,prefix+b.p+'.'+i,'')); }
      else if(b.t==='daftar'){ (getP(root,b.p)||[]).forEach((it,i)=>walk(b.fields,it,prefix+b.p+'.'+i+'.',b.nama+' '+(i+1))); }
      else if(b.t==='galeri'){ (getP(root,b.p)||[]).forEach((it,i)=>cb(bag,{label:'Keterangan foto '+(i+1),tipe:'teks'},it.ket,prefix+b.p+'.'+i+'.ket','')); }
      else if(b.tipe!=='gambar') cb(bag,b,getP(root,b.p),prefix+b.p,ctx);
    });
  };
  if(bag.isi) walk(bag.isi,S.konten,'','');
}
function kumpulPerlu(){
  const out=[];
  BAGIAN.forEach(bag=>telusuri(bag,(bg,f,v,path,ctx)=>{ if(perlu(f,v)) out.push({bagian:bg,label:(ctx?ctx+' › ':'')+f.label,path,nilai:v}); }));
  return out;
}

/* =========================================================
   UNGGAH FOTO
   ========================================================= */
async function kompres(bmp,maks,tipe){
  let skala=Math.min(1,maks/Math.max(bmp.width,bmp.height));
  for(let i=0;i<4;i++){
    const w=Math.max(1,Math.round(bmp.width*skala)), ht=Math.max(1,Math.round(bmp.height*skala));
    const c=document.createElement('canvas'); c.width=w; c.height=ht;
    c.getContext('2d').drawImage(bmp,0,0,w,ht);
    const blob=await new Promise(r=>c.toBlob(r,tipe,0.88));
    if(!blob) throw new Error('Gagal memproses gambar.');
    if(blob.size<=2.5*1024*1024||i===3) return blob;
    skala*=0.75;
  }
}
const keBase64=blob=>new Promise((ok,gagal)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=()=>gagal(new Error('Gagal membaca berkas.')); r.readAsDataURL(blob); });
async function unggahFoto(file,opsi,lapor){
  if(!/^image\//.test(file.type)) throw new Error('Berkas harus berupa gambar (PNG, JPG, atau WebP).');
  if(file.size>30*1024*1024) throw new Error('Ukuran berkas terlalu besar (maksimal 30 MB).');
  let bmp; try{ bmp=await createImageBitmap(file); }catch(e){ throw new Error('Gambar tidak dapat dibaca. Coba format PNG atau JPG.'); }
  lapor&&lapor('Mengecilkan ukuran foto…');
  const blob=await kompres(bmp,opsi.maks||1400,opsi.format==='png'?'image/png':'image/webp');
  lapor&&lapor('Mengunggah… ('+Math.round(blob.size/1024)+' KB)');
  const j=await api('unggah',{nama:file.name,tipe:blob.type,data:await keBase64(blob)});
  return j.url;
}

let _tunda; function tandai(){ clearTimeout(_tunda); _tunda=setTimeout(()=>{ perbaruiBilah(); simpanDraf(); },250); }

function ekstrakPeta(v){
  v=String(v||'').trim();
  const m=/src\s*=\s*["']([^"']+)["']/i.exec(v);
  if(m) v=m[1];
  return v.replace(/&amp;/g,'&').trim();
}
const petaSah=v=>!v||/^https:\/\/(www\.google\.com\/maps|maps\.google\.com|www\.google\.co\.id\/maps)/i.test(v);

function kontrol(f,root,prefix){
  if(f.tipe==='gambar') return fldGambar(f,root,prefix);
  const id=uid(), path=prefix+f.p;
  const wrap=h('div',{class:'fld','data-path':path});
  const lab=h('label',{for:id},f.label,h('span',{class:'perlu-tag'},'Perlu dilengkapi'));
  const nilai=getP(root,f.p);
  const simpan=v=>{ setP(root,f.p,v); wrap.classList.toggle('perlu',perlu(f,v)); tandai(); };
  let el, tambahan=[];

  switch(f.tipe){
    case 'area':
      el=h('textarea',{id,rows:f.rows||3,maxlength:f.maks||null,value:nilai==null?'':nilai});
      el.addEventListener('input',()=>simpan(el.value)); break;
    case 'saklar': {
      const cb=h('input',{type:'checkbox',id,checked:!!nilai});
      cb.addEventListener('change',()=>simpan(cb.checked));
      wrap.append(h('div',{class:'lab'},f.label));
      wrap.append(h('label',{class:'saklar',for:id},cb,h('span',{class:'sl','aria-hidden':'true'}),h('span',{class:'tx'},f.teks||'')));
      if(f.bantuan) wrap.append(h('p',{class:'bantuan'},f.bantuan));
      return wrap; }
    case 'pilih':
      el=h('select',{id},...f.opsi.map(o=>h('option',{value:o[0]},o[1])));
      el.value=nilai==null?f.opsi[0][0]:nilai;
      el.addEventListener('change',()=>simpan(el.value)); break;
    case 'angka':
      el=h('input',{type:'number',id,inputmode:'numeric',min:'0',step:'1',value:nilai==null?'':nilai});
      el.addEventListener('input',()=>simpan(el.value===''?'':Number(el.value))); break;
    case 'tanggal':
      el=h('input',{type:'date',id,value:/^\d{4}-\d{2}-\d{2}$/.test(nilai||'')?nilai:''});
      el.addEventListener('input',()=>simpan(el.value)); break;
    case 'jam':
      el=h('input',{type:'time',id,value:nilai||''});
      el.addEventListener('input',()=>simpan(el.value)); break;
    case 'ikon': {
      el=h('input',{type:'text',id,class:'ikon-input',maxlength:'8',value:nilai||'',autocomplete:'off'});
      el.addEventListener('input',()=>simpan(el.value));
      tambahan.push(h('div',{class:'ikon-baris'},...IKON.map(e=>h('button',{type:'button','aria-label':'Pilih ikon '+e,onclick:()=>{ el.value=e; simpan(e); }},e))));
      tambahan.push(h('p',{class:'bantuan'},'Pilih dari daftar, atau ketik/tempel emoji lain.'));
      break; }
    case 'wa': {
      el=h('input',{type:'tel',id,inputmode:'tel',placeholder:'6281234567890',value:nilai||'',autocomplete:'off'});
      const norm=()=>{ let d=el.value.replace(/\D/g,''); if(d.startsWith('0')) d='62'+d.slice(1); el.value=d; simpan(d); };
      el.addEventListener('input',()=>simpan(el.value.replace(/\D/g,'')));
      el.addEventListener('blur',norm); break; }
    case 'peta': {
      el=h('textarea',{id,rows:2,placeholder:'Tempel kode sematan atau alamat peta di sini',value:nilai||''});
      const info=h('p',{class:'bantuan',style:'color:var(--merah)'});
      const cek=()=>{ const v=ekstrakPeta(el.value); info.textContent=petaSah(v)?'':'Alamat ini bukan peta sematan Google Maps, jadi tidak akan tampil di website.'; };
      el.addEventListener('input',()=>{ const v=ekstrakPeta(el.value); simpan(v); cek(); });
      el.addEventListener('blur',()=>{ const v=ekstrakPeta(el.value); el.value=v; simpan(v); cek(); });
      tambahan.push(info); cek(); break; }
    default: {
      const tipe=f.tipe==='url'?'url':'text';
      el=h('input',{type:tipe,id,maxlength:f.maks||null,value:nilai==null?'':nilai,autocomplete:'off',placeholder:f.tipe==='url'?'https://…':null,list:f.datalist?id+'l':null});
      el.addEventListener('input',()=>simpan(el.value));
      if(f.datalist) tambahan.push(h('datalist',{id:id+'l'},...f.datalist.map(d=>h('option',{value:d}))));
    }
  }
  wrap.append(lab,el,...tambahan);
  if(f.bantuan) wrap.append(h('p',{class:'bantuan'},f.bantuan));
  wrap.classList.toggle('perlu',perlu(f,nilai));
  return wrap;
}

function fldGambar(f,root,prefix){
  const path=prefix+f.p, id=uid();
  const wrap=h('div',{class:'fld','data-path':path});
  const thumb=h('div',{class:'thumb'});
  const status=h('div',{class:'status',role:'status'});
  const file=h('input',{type:'file',accept:'image/png,image/jpeg,image/webp,image/gif',hidden:true,id});
  const url=h('input',{type:'url',placeholder:'https://…','aria-label':'Alamat foto '+f.label});
  const btnUnggah=h('button',{type:'button',class:'btn sek kecil'},'⬆ Unggah foto');
  const btnHapus=h('button',{type:'button',class:'btn bahaya kecil'},'Kembalikan ke bawaan');
  const muat=()=>{
    const v=getP(root,f.p)||'';
    thumb.replaceChildren(v?h('img',{src:v,alt:'Pratinjau '+f.label}):h('span',{class:'kosong'},'Memakai foto bawaan website'));
    url.value=v; btnHapus.hidden=!v;
  };
  btnUnggah.addEventListener('click',()=>file.click());
  file.addEventListener('change',async()=>{
    const berkas=file.files[0]; file.value=''; if(!berkas) return;
    btnUnggah.disabled=true; status.className='status proses';
    try{
      const u=await unggahFoto(berkas,f,t=>status.textContent=t);
      setP(root,f.p,u); muat(); tandai();
      status.className='status'; status.textContent='✓ Foto terunggah. Klik “Simpan & Terbitkan” agar tampil di website.';
    }catch(e){ status.textContent=''; toast(e.message,'galat'); }
    btnUnggah.disabled=false;
  });
  btnHapus.addEventListener('click',()=>{ setP(root,f.p,''); muat(); status.textContent=''; tandai(); });
  url.addEventListener('change',()=>{ setP(root,f.p,url.value.trim()); muat(); tandai(); });
  muat();
  wrap.append(h('div',{class:'lab'},f.label),
    h('div',{class:'img-fld'},thumb,h('div',{class:'img-info'},
      h('div',{class:'img-aksi'},btnUnggah,btnHapus),
      h('details',null,h('summary',null,'Atau tempel alamat foto'),url),
      status)),
    f.bantuan?h('p',{class:'bantuan'},f.bantuan):null,file);
  return wrap;
}

function blokDaftarTeks(b,prefix){
  const path=prefix+b.p;
  const box=h('div');
  const dapat=()=>{ let a=getP(S.konten,path); if(!Array.isArray(a)){ a=[]; setP(S.konten,path,a); } return a; };
  const gambar=fokus=>{
    box.replaceChildren(); const arr=dapat();
    if(!arr.length) box.append(h('p',{class:'kosong-daftar'},'Belum ada isi.'));
    arr.forEach((v,i)=>{
      const f={label:b.label+' '+(i+1),tipe:'teks'};
      const inp=h('input',{type:'text',value:v,'aria-label':f.label,autocomplete:'off'});
      const baris=h('div',{class:'row-teks'+(perlu(f,v)?' perlu':''),'data-path':path+'.'+i},inp,
        h('button',{type:'button',class:'btn sek ikon','aria-label':'Naikkan',disabled:i===0,onclick:()=>{ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; gambar(i-1); tandai(); }},'↑'),
        h('button',{type:'button',class:'btn sek ikon','aria-label':'Turunkan',disabled:i===arr.length-1,onclick:()=>{ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; gambar(i+1); tandai(); }},'↓'),
        h('button',{type:'button',class:'btn bahaya ikon','aria-label':'Hapus',onclick:()=>{ if(confirm('Hapus poin ini?')){ arr.splice(i,1); gambar(); tandai(); } }},'🗑'));
      inp.addEventListener('input',()=>{ arr[i]=inp.value; baris.classList.toggle('perlu',perlu(f,inp.value)); tandai(); });
      box.append(baris);
      if(fokus===i) setTimeout(()=>inp.focus(),0);
    });
    box.append(h('button',{type:'button',class:'btn sek kecil tambah',onclick:()=>{ arr.push(''); gambar(arr.length-1); tandai(); }},'＋ '+(b.tambah||'Tambah')));
  };
  gambar();
  return h('section',{class:'kartu daftar-kartu'},h('h2',null,b.judul),box);
}

      const aksi=h('div',{class:'item-aksi'},

        h('button',{type:'button',class:'btn sek kecil',disabled:i===arr.length-1,onclick:()=>{ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; gambar(i+1); tandai(); }},'↓ Turunkan'),
        h('button',{type:'button',class:'btn bahaya kecil',onclick:()=>{ if(confirm('Hapus “'+(b.judulItem(it,i)||b.nama)+'”? Tindakan ini baru berlaku di website setelah Anda menekan Simpan & Terbitkan.')){ arr.splice(i,1); gambar(); tandai(); } }},'🗑 Hapus'));

    });

}

function blokGaleri(b){
  const path=b.p, box=h('div'), status=h('div',{class:'status',role:'status'});
  const dapat=()=>{ let a=getP(S.konten,path); if(!Array.isArray(a)){ a=[]; setP(S.konten,path,a); } return a; };
  const berkasBanyak=h('input',{type:'file',accept:'image/png,image/jpeg,image/webp,image/gif',multiple:true,hidden:true});
  const gambar=()=>{
    box.replaceChildren(); const arr=dapat();
    if(!arr.length) box.append(h('p',{class:'kosong-daftar'},'Belum ada foto. Klik “Tambah foto” di bawah.'));
    const grid=h('div',{class:'g-grid'});
    arr.forEach((it,i)=>{
      const thumb=h('div',{class:'thumb'},it.foto?h('img',{src:it.foto,alt:it.ket||'Foto '+(i+1)}):h('span',{class:'kosong'},'Foto bawaan (belum diganti)'));
      const ket=h('input',{type:'text',value:it.ket||'',placeholder:'Keterangan foto','aria-label':'Keterangan foto '+(i+1),maxlength:'80'});
      ket.addEventListener('input',()=>{ it.ket=ket.value; tandai(); });
      const ganti=h('input',{type:'file',accept:'image/png,image/jpeg,image/webp,image/gif',hidden:true});
      ganti.addEventListener('change',async()=>{
        const f1=ganti.files[0]; ganti.value=''; if(!f1) return;
        status.className='status proses';
        try{ it.foto=await unggahFoto(f1,{maks:1400},t=>status.textContent=t); status.className='status'; status.textContent='✓ Foto diganti.'; gambar(); tandai(); }
        catch(e){ status.textContent=''; toast(e.message,'galat'); }
      });
      grid.append(h('div',{class:'g-kartu','data-path':path+'.'+i+'.ket'},thumb,h('div',{class:'g-isi'},ket,
        h('button',{type:'button',class:'btn sek kecil',onclick:()=>ganti.click()},'Ganti foto'),
        h('div',{class:'g-aksi'},
          h('button',{type:'button',class:'btn sek ikon','aria-label':'Geser ke depan',disabled:i===0,onclick:()=>{ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; gambar(); tandai(); }},'←'),
          h('button',{type:'button',class:'btn sek ikon','aria-label':'Geser ke belakang',disabled:i===arr.length-1,onclick:()=>{ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; gambar(); tandai(); }},'→'),
          h('button',{type:'button',class:'btn bahaya ikon','aria-label':'Hapus foto',onclick:()=>{ if(confirm('Hapus foto ini dari galeri?')){ arr.splice(i,1); gambar(); tandai(); } }},'🗑')),ganti)));
    });
    box.append(grid);
  };
  berkasBanyak.addEventListener('change',async()=>{
    const daftar=[...berkasBanyak.files]; berkasBanyak.value=''; if(!daftar.length) return;
    status.className='status proses'; let ok=0;
    for(let i=0;i<daftar.length;i++){
      try{
        const u=await unggahFoto(daftar[i],{maks:1400},t=>status.textContent='Foto '+(i+1)+' dari '+daftar.length+': '+t);
        const nama=daftar[i].name.replace(/\.[^.]*$/,'').replace(/[-_]+/g,' ').trim();
        dapat().push({foto:u,ket:nama}); ok++; gambar();
      }catch(e){ toast('“'+daftar[i].name+'”: '+e.message,'galat'); }
    }
    status.className='status'; status.textContent=ok?'✓ '+ok+' foto ditambahkan. Klik “Simpan & Terbitkan” agar tampil di website.':'';
    if(ok) tandai();
  });
  gambar();
  const tambah=h('button',{type:'button',class:'btn sek kecil tambah',onclick:()=>berkasBanyak.click()},'＋ Tambah foto (boleh banyak sekaligus)');
  return h('section',{class:'kartu daftar-kartu'},h('h2',null,b.judul),box,tambah,status,berkasBanyak);
}

function renderBlok(b,root,prefix){
  if(b.t==='grup') return h('section',{class:'kartu'},h('h2',null,b.judul),b.bantuan?h('p',{class:'bantuan',style:'margin:-.4rem 0 1rem'},b.bantuan):null,...b.fields.map(f=>kontrol(f,root,prefix)));
  if(b.t==='daftarTeks') return blokDaftarTeks(b,prefix);
  if(b.t==='daftar') return blokDaftar(b,prefix);
  if(b.t==='galeri') return blokGaleri(b);
  return h('div');
}

/* =========================================================
   HALAMAN KHUSUS
   ========================================================= */
function halRingkasan(){
  const el=[];
  if(S.sandiAwal) el.push(h('div',{class:'banner'},h('div',{class:'teks'},h('strong',null,'Anda masih memakai sandi awal. '),'Demi keamanan, segera ganti sandi.'),h('button',{type:'button',class:'btn kecil',onclick:()=>tampilBagian('pengaturan')},'Ganti sandi')));
  if(S.pertama) el.push(h('div',{class:'banner info'},h('div',{class:'teks'},h('strong',null,'Selamat datang! '),'Ini pertama kalinya dasbor dipakai, jadi isi website yang sekarang sudah dimuat di sini. Ubah seperlunya, lalu tekan ',h('b',null,'Simpan & Terbitkan'),' agar website membaca isi dari dasbor.')));
  const sudah=S.diperbarui?'Terakhir diterbitkan: '+fmtWaktu(S.diperbarui):'Belum pernah diterbitkan.';
  el.push(h('p',{style:'color:var(--lembut);margin-bottom:1rem'},sudah));
  const n=(p)=>(getP(S.konten,p)||[]).length;
  const tegel=(angka,label,id)=>h('button',{type:'button',onclick:()=>tampilBagian(id)},h('b',null,String(angka)),h('span',null,label));
  el.push(h('div',{class:'tegel'},tegel(n('berita'),'Berita','berita'),tegel(n('galeri'),'Foto galeri','galeri'),tegel(n('program'),'Program','program'),tegel(n('fasilitas'),'Fasilitas','fasilitas'),tegel(n('testimoni'),'Testimoni','testimoni')));

  const daftar=kumpulPerlu();
  const kartu=h('section',{class:'kartu daftar-kartu'},h('h2',null,'✏️ Perlu dilengkapi ('+daftar.length+')'));
  if(!daftar.length) kartu.append(h('p',{class:'kosong-daftar'},'Semua isian penting sudah lengkap. 🎉'));
  else{
    kartu.append(h('p',{class:'bantuan',style:'margin:-.3rem 0 .8rem'},'Isian bertanda [GANTI] atau yang masih kosong. Klik “Isi” untuk langsung menuju isiannya.'));
    const list=h('div',{class:'perlu-daftar'});
    daftar.slice(0,40).forEach(d=>list.append(h('div',{class:'perlu-baris'},
      h('div',{class:'info'},h('b',null,d.bagian.judul+' › '+d.label),h('span',null,String(d.nilai||'(kosong)'))),
      h('button',{type:'button',class:'btn sek kecil',onclick:()=>pindah(d.bagian.id,d.path)},'Isi'))));
    kartu.append(list);
    if(daftar.length>40) kartu.append(h('p',{class:'bantuan'},'…dan '+(daftar.length-40)+' lainnya.'));
  }
  el.push(kartu);
  el.push(h('section',{class:'kartu daftar-kartu'},h('h2',null,'🚀 Pintasan'),
    h('div',{class:'img-aksi'},
      h('button',{type:'button',class:'btn sek kecil',onclick:()=>tampilBagian('beranda')},'Ganti foto utama'),
      h('button',{type:'button',class:'btn sek kecil',onclick:()=>tampilBagian('galeri')},'Tambah foto galeri'),
      h('button',{type:'button',class:'btn sek kecil',onclick:()=>{ tampilBagian('berita'); }},'Tulis berita'),
      h('button',{type:'button',class:'btn sek kecil',onclick:()=>tampilBagian('kontak')},'Ubah kontak'))));
  return el;
}

function halPengaturan(){
  const el=[];
  /* sandi */
  const lama=h('input',{type:'password',id:'sLama',autocomplete:'current-password'});
  const baru=h('input',{type:'password',id:'sBaru',autocomplete:'new-password'});
  const ulang=h('input',{type:'password',id:'sUlang',autocomplete:'new-password'});
  const gal=h('div',{class:'galat',role:'alert'});
  const btn=h('button',{type:'submit',class:'btn'},'Simpan sandi baru');
  const form=h('form',{onsubmit:async e=>{
    e.preventDefault(); gal.textContent='';
    if(baru.value.length<8){ gal.textContent='Sandi baru minimal 8 karakter.'; return; }
    if(baru.value!==ulang.value){ gal.textContent='Pengulangan sandi tidak sama.'; return; }
    btn.disabled=true;
    try{ await api('gantiSandi',{lama:lama.value,baru:baru.value}); S.sandiAwal=false; lama.value=baru.value=ulang.value=''; toast('Sandi berhasil diganti.'); }
    catch(er){ gal.textContent=er.message; }
    btn.disabled=false;
  }},
    h('div',{class:'fld'},h('label',{for:'sLama'},'Sandi saat ini'),lama),
    h('div',{class:'fld'},h('label',{for:'sBaru'},'Sandi baru'),baru,h('p',{class:'bantuan'},'Minimal 8 karakter.')),
    h('div',{class:'fld'},h('label',{for:'sUlang'},'Ulangi sandi baru'),ulang),gal,btn);
  el.push(h('section',{class:'kartu daftar-kartu'},h('h2',null,'🔑 Ganti sandi'),form));

  /* riwayat */
  const boxR=h('div');
  const btnR=h('button',{type:'button',class:'btn sek kecil',onclick:async()=>{
    btnR.disabled=true; boxR.replaceChildren(h('p',{class:'bantuan'},'Memuat…'));
    try{
      const j=await api('riwayat'); boxR.replaceChildren();
      if(!j.daftar.length) boxR.append(h('p',{class:'kosong-daftar'},'Belum ada riwayat. Versi lama tersimpan setiap kali Anda menerbitkan perubahan.'));
      j.daftar.forEach(v=>boxR.append(h('div',{class:'riwayat-baris'},h('span',null,fmtWaktu(v.waktu)),
        h('button',{type:'button',class:'btn sek kecil',onclick:async()=>{
          if(!confirm('Pulihkan versi '+fmtWaktu(v.waktu)+'?\n\nVersi ini akan langsung diterbitkan ke website. Versi yang sekarang tetap tersimpan di riwayat.')) return;
          try{ const r=await api('pulihkan',{id:v.id}); S.konten=lengkapi(r.konten||{},BAWAAN); S.server=JSON.stringify(S.konten); S.diperbarui=r.diperbarui; S.pertama=false; simpanDraf(); perbaruiBilah(); toast('Versi berhasil dipulihkan dan diterbitkan.'); }
          catch(er){ toast(er.message,'galat'); }
        }},'Pulihkan'))));
    }catch(er){ boxR.replaceChildren(); toast(er.message,'galat'); }
    btnR.disabled=false;
  }},'Tampilkan riwayat');
  el.push(h('section',{class:'kartu daftar-kartu'},h('h2',null,'🕘 Riwayat versi'),h('p',{class:'bantuan',style:'margin-top:-.3rem'},'20 versi terakhir disimpan otomatis. Gunakan ini bila ada isi yang terhapus atau salah terbit.'),btnR,h('div',{style:'margin-top:.8rem'},boxR)));

  /* cadangan */
  const impor=h('input',{type:'file',accept:'application/json,.json',hidden:true,onchange:async()=>{
    const f1=impor.files[0]; impor.value=''; if(!f1) return;
    try{
      const o=JSON.parse(await f1.text());
      if(!o||typeof o!=='object'||Array.isArray(o)) throw new Error('x');
      if(!confirm('Muat isi dari berkas cadangan ini? Isi di layar akan diganti (belum terbit sampai Anda menekan Simpan & Terbitkan).')) return;
      S.konten=lengkapi(o,BAWAAN); tandai(); perbaruiBilah(); toast('Cadangan dimuat. Periksa, lalu klik Simpan & Terbitkan.');
    }catch(e){ toast('Berkas cadangan tidak valid.','galat'); }
  }});
  el.push(h('section',{class:'kartu daftar-kartu'},h('h2',null,'💾 Cadangan'),
    h('p',{class:'bantuan',style:'margin-top:-.3rem'},'Unduh salinan seluruh isi website sebagai berkas, atau muat kembali dari berkas tersebut.'),
    h('div',{class:'img-aksi'},
      h('button',{type:'button',class:'btn sek kecil',onclick:()=>{
        const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(S.konten,null,1)],{type:'application/json'})),download:'cadangan-website-'+new Date().toISOString().slice(0,10)+'.json'});
        document.body.append(a); a.click(); a.remove();
      }},'⬇ Unduh cadangan'),
      h('button',{type:'button',class:'btn sek kecil',onclick:()=>impor.click()},'⬆ Muat dari cadangan'),
      h('button',{type:'button',class:'btn bahaya kecil',onclick:()=>{
        if(!confirm('Kembalikan SEMUA isi ke bawaan awal? Isi di layar akan diganti (belum terbit sampai Anda menekan Simpan & Terbitkan).')) return;
        S.konten=klon(BAWAAN); tandai(); perbaruiBilah(); tampilBagian('pengaturan'); toast('Isi dikembalikan ke bawaan. Klik Simpan & Terbitkan bila sudah yakin.');
      }},'Kembalikan ke isi bawaan')),impor));

  /* koneksi */
  el.push(h('section',{class:'kartu daftar-kartu'},h('h2',null,'🔗 Koneksi'),
    h('p',{class:'bantuan',style:'margin-top:-.3rem'},'Alamat API yang dipakai dasbor ini:'),
    h('p',{style:'word-break:break-all;font-size:.85rem;background:var(--marun-muda);padding:.6rem .8rem;border-radius:10px'},apiUrl()||'(belum diisi)'),
    h('p',{class:'bantuan'},'Foto yang sudah tidak dipakai tetap tersimpan di folder Google Drive “Website Muadalah Wustha Al-Amiriyyah > gambar”. Anda boleh menghapusnya langsung dari Drive bila perlu.')));
  return el;
}

/* =========================================================
   NAVIGASI & TAMPILAN
   ========================================================= */
function bangunNav(){
  const nav=$('#nav'); nav.replaceChildren();
  BAGIAN.forEach(b=>{
    const a=h('a',{href:'#'+b.id,'data-id':b.id},h('span',{'aria-hidden':'true'},b.ikon),h('span',null,b.judul),h('span',{class:'cnt','data-b':b.id,title:'Isian perlu dilengkapi'}));
    a.addEventListener('click',e=>{ e.preventDefault(); tampilBagian(b.id); });
    nav.append(a);
  });
}
function tampilBagian(id){
  const b=BAGIAN.find(x=>x.id===id)||BAGIAN[0]; S.bagian=b.id;
  $$('#nav a').forEach(a=>{
    const on=a.dataset.id===b.id; a.classList.toggle('aktif',on);
    if(on){ a.setAttribute('aria-current','page'); if(window.innerWidth<=900) a.scrollIntoView({block:'nearest',inline:'center'}); } else a.removeAttribute('aria-current');
  });
  const u=$('#utama'); u.replaceChildren();
  u.append(h('div',{class:'judul-bagian'},h('h1',null,b.ikon+' '+b.judul),b.desk?h('p',null,b.desk):null));
  if(b.khusus==='ringkasan') u.append(...halRingkasan());
  else if(b.khusus==='pengaturan') u.append(...halPengaturan());
  else u.append(...b.isi.map(x=>renderBlok(x,S.konten,'')));
  window.scrollTo({top:0});
  if(location.hash!=='#'+b.id) history.replaceState(null,'','#'+b.id);
  perbaruiBilah();
}
function pindah(id,path){
  tampilBagian(id);
  setTimeout(()=>{
    const e=$('[data-path="'+CSS.escape(path)+'"]'); if(!e) return;
    const d=e.closest('details'); if(d) d.open=true;
    e.scrollIntoView({block:'center'}); e.classList.add('kilat');
    const inp=$('input:not([type=file]),textarea,select',e)||$('button',e); if(inp) inp.focus({preventScroll:true});
    setTimeout(()=>e.classList.remove('kilat'),1700);
  },60);
}
function perbaruiBilah(){
  const k=kotor(), semua=kumpulPerlu();
  $('#bilah').classList.toggle('kotor',k);
  $('#bilahStatus').replaceChildren(
    h('strong',null,k?'Ada perubahan yang belum diterbitkan':'Semua perubahan sudah terbit'),
    semua.length?h('span',{class:'peringatan'},semua.length+' isian perlu dilengkapi'):h('span',{style:'color:var(--lembut)'},'Semua isian penting sudah lengkap'));
  $('#btnSimpan').disabled=!k||S.sibuk;
  $('#btnBatal').hidden=!k||S.pertama;
  $$('#nav .cnt').forEach(c=>{ const n=semua.filter(x=>x.bagian.id===c.dataset.b).length; c.textContent=n||''; c.classList.toggle('ada',n>0); });
}

/* =========================================================
   SIMPAN, MASUK, KELUAR
   ========================================================= */
async function simpan(){
  const sisa=kumpulPerlu().length;
  if(sisa&&!confirm('Masih ada '+sisa+' isian yang belum lengkap (bertanda [GANTI] atau kosong).\n\nTetap terbitkan ke website sekarang?')) return;
  S.sibuk=true; $('#btnSimpan').textContent='Menerbitkan…'; perbaruiBilah();
  try{
    const j=await api('simpan',{konten:S.konten});
    S.server=JSON.stringify(S.konten); S.diperbarui=j.diperbarui||new Date().toISOString(); S.pertama=false;
    try{ localStorage.removeItem(KD); }catch(e){}
    toast('✓ Berhasil diterbitkan. Website akan menampilkan perubahan saat dibuka/dimuat ulang.');
    if(S.bagian==='ringkasan') tampilBagian('ringkasan');
  }catch(e){ toast(e.message,'galat'); }
  S.sibuk=false; $('#btnSimpan').textContent='Simpan & Terbitkan'; perbaruiBilah();
}
function batal(){
  if(!confirm('Buang semua perubahan yang belum diterbitkan dan kembali ke versi terakhir yang terbit?')) return;
  S.konten=JSON.parse(S.server); try{ localStorage.removeItem(KD); }catch(e){}
  tampilBagian(S.bagian); toast('Perubahan dibuang.');
}
async function muatKonten(){
  const j=await bacaPublik();
  const k=j.konten||{}; S.diperbarui=j.diperbarui||null;
  if(!Object.keys(k).length){ S.konten=klon(BAWAAN); S.server='{}'; S.pertama=true; }
  else{ S.konten=lengkapi(k,BAWAAN); S.server=JSON.stringify(S.konten); S.pertama=false; }
  /* draf dari sesi sebelumnya */
  try{
    const d=JSON.parse(localStorage.getItem(KD)||'null');
    if(d&&d.konten&&JSON.stringify(d.konten)!==JSON.stringify(S.konten)) S.draf=d;
    else S.draf=null;
  }catch(e){ S.draf=null; }
}
function tampilLogin(pesan){
  $('#app').hidden=true; $('#login').hidden=false;
  const perluApi=!KONFIG.apiUrl; $('#bagApi').hidden=!perluApi;
  if(perluApi) $('#inApi').value=localStorage.getItem(KA)||'';
  $('#galatLogin').textContent=pesan||''; $('#btnMasuk').disabled=false; $('#btnMasuk').textContent='Masuk';
  setTimeout(()=>{ (perluApi&&!$('#inApi').value?$('#inApi'):$('#inSandi')).focus(); },50);
}
function keluarPaksa(pesan){ hapusSesi(); S.token=null; tampilLogin(pesan); }
function masukApp(){
  $('#login').hidden=true; $('#app').hidden=false;
  $('#lihatSitus').href=KONFIG.situsUrl;
  bangunNav();
  const awal=(location.hash||'').slice(1);
  tampilBagian(BAGIAN.some(b=>b.id===awal)?awal:'ringkasan');
  if(S.draf){
    const u=$('#utama');
    u.insertBefore(h('div',{class:'banner',id:'bannerDraf'},h('div',{class:'teks'},h('strong',null,'Ada perubahan tersimpan dari sesi sebelumnya '),'(belum diterbitkan, '+fmtWaktu(S.draf.waktu)+').'),
      h('button',{type:'button',class:'btn kecil',onclick:()=>{ S.konten=lengkapi(S.draf.konten,BAWAAN); S.draf=null; tampilBagian(S.bagian); toast('Perubahan sebelumnya dipulihkan.'); }},'Lanjutkan'),
      h('button',{type:'button',class:'btn sek kecil',onclick:()=>{ S.draf=null; try{localStorage.removeItem(KD);}catch(e){} $('#bannerDraf').remove(); }},'Buang')),u.children[1]);
  }
}

$('#lihatSandi').addEventListener('click',()=>{ const i=$('#inSandi'); i.type=i.type==='password'?'text':'password'; });
$('#formLogin').addEventListener('submit',async e=>{
  e.preventDefault();
  const galat=$('#galatLogin'), btn=$('#btnMasuk'); galat.textContent='';
  if(!KONFIG.apiUrl){
    const u=$('#inApi').value.trim();
    if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(u)&&!/^http:\/\/(localhost|127\.0\.0\.1)/.test(u)){ galat.textContent='Alamat API tidak sesuai. Salin “URL aplikasi web” dari Apps Script (berakhiran /exec).'; return; }
    try{ localStorage.setItem(KA,u); }catch(er){}
  }
  btn.disabled=true; btn.textContent='Memeriksa…';
  try{
    const j=await api('masuk',{sandi:$('#inSandi').value});
    S.token=j.token; S.sandiAwal=!!j.sandiAwal; simpanSesi($('#inIngat').checked,j);
    $('#inSandi').value='';
    btn.textContent='Memuat isi website…'; await muatKonten(); masukApp();
  }catch(er){ galat.textContent=er.message; btn.disabled=false; btn.textContent='Masuk'; }
});
$('#btnSimpan').addEventListener('click',simpan);
$('#btnBatal').addEventListener('click',batal);
$('#btnKeluar').addEventListener('click',async()=>{
  if(kotor()&&!confirm('Ada perubahan yang belum diterbitkan. Perubahan disimpan sementara di perangkat ini, tetapi belum tampil di website.\n\nTetap keluar?')) return;
  try{ await api('keluar'); }catch(e){}
  hapusSesi(); S.token=null; tampilLogin();
});
window.addEventListener('beforeunload',e=>{ if(S.token&&kotor()&&!S.pertama){ e.preventDefault(); e.returnValue=''; } });
window.addEventListener('hashchange',()=>{ const id=(location.hash||'').slice(1); if(S.token&&id&&id!==S.bagian&&BAGIAN.some(b=>b.id===id)) tampilBagian(id); });

(async function mulai(){
  const s=bacaSesi();
  if(s&&apiUrl()){
    S.token=s.token; S.sandiAwal=s.sandiAwal;
    try{ await muatKonten(); masukApp(); return; }catch(e){ hapusSesi(); S.token=null; }
  }
  tampilLogin();
})();

$('#bilah').addEventListener('click',()=>{});
})();
</script>
